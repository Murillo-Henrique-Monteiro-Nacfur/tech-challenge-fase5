spring:
  application:
    name: fase5
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/fase5}
    username: ${DATASOURCE_USERNAME:application}
    password: ${DATASOURCE_PASSWORD:7KTu)$U9W1%7}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: true
        default_schema: public
  liquibase:
    change-log: classpath:liquibase/db/changelog/db.changelog-master.xml
    default-schema: public

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:noreply@fase5.postech.fiap.com}
    stock-report:
      recipients: ${MAIL_RECIPIENTS:admin@fase5.postech.fiap.com}

  stock-analysis:
    scheduled:
      enabled: ${STOCK_ANALYSIS_ENABLED:false}  # Por padrão desabilitado, habilite em produção
      cron: ${STOCK_ANALYSIS_CRON:0 0 8 1 * ?}  # Todo dia 1º às 08:00

