version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fase5-postgres
    environment:
      POSTGRES_DB: fase5
      POSTGRES_USER: application
      POSTGRES_PASSWORD: 7KTu)$$U9W1%7
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fase5-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U application -d fase5"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  fase5-network:
    driver: bridge

